name: Feature request
description: Suggest a new input, output, or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do with the current inputs/outputs?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: New input/output or behavior change, with defaults and exit codes for invalid values.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could post_process, dry_run, or an existing input cover this?
