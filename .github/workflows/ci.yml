name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck build.sh entrypoint.sh

  validate-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate action.yml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
      - name: Check action metadata
        run: |
          python3 - <<'EOF'
          import yaml
          meta = yaml.safe_load(open('action.yml'))
          assert meta['runs']['using'] == 'docker', 'action must use docker runner'
          required = {'pkgname', 'pkgbuild', 'commit_username', 'commit_email', 'ssh_private_key'}
          missing = required - set(meta['inputs'])
          assert not missing, f'missing required inputs: {missing}'
          print('action.yml looks good')
          EOF

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t aur-publish:ci .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run behavior tests
        run: bash tests/run.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        run: |
          curl -sL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml
          rm -f actionlint actionlint.tar.gz
